<!doctype html>
<html><head><meta charset="utf-8"><title>Contact</title></head>
<body>
<h1>Contact</h1>
<form action="thanks.html" method="get">
  <label for="fn">First Name</label><input id="fn" name="first-name" type="text" required>
  <label for="ln">Last Name</label><input id="ln" name="last-name" type="text" required>
  <label for="c">Company</label><input id="c" name="company" type="text" required>
  <label for="e">Email</label><input id="e" name="email" type="email" required>
  <label for="s">Subject</label><input id="s" name="subject" type="text" placeholder="e.g., Support">
  <label for="m">Comment or Message</label><textarea id="m" name="message" placeholder="Enter text here"></textarea>
  <button type="submit">Submit</button>
</form>
</body></html>
